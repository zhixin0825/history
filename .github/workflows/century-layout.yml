name: Read-only chronology inventory
on:
  push:
    branches: [work/century-layout-20261004]
    paths: ['.github/workflows/century-layout.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ab0b698f5908bafa621ac6a54078c1115eed3580
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            years
            meta
            sources/摘录
            sources/春秋左传
          sparse-checkout-cone-mode: true
      - name: Package text inventory only
        run: |
          python3 - <<'PY'
          import json,subprocess,tarfile
          from pathlib import Path
          tree={}
          for row in subprocess.check_output(['git','ls-tree','-rz','HEAD']).split(b'\0'):
              if not row:continue
              head,path=row.split(b'\t',1)
              mode,kind,sha=head.decode().split()
              tree[path.decode()]={'mode':mode,'type':kind,'sha':sha}
          Path('/tmp/tree.json').write_text(json.dumps(tree,ensure_ascii=False))
          with tarfile.open('/tmp/chronology-texts.tar.gz','w:gz') as tar:
              tar.add('/tmp/tree.json',arcname='tree.json')
              for p in tree:
                  f=Path(p)
                  if f.is_file() and (p.endswith('.md') or p.startswith('meta/') or p=='.gitattributes'):
                      tar.add(f,arcname=p)
          print('Saved repository text inventory; no repository files changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chronology-texts
          path: /tmp/chronology-texts.tar.gz
          retention-days: 7

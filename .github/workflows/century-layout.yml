name: Validate century directory layout
on:
  push:
    branches: [work/century-layout-20261004]
    paths: ['_work/reorganize.py', '.github/workflows/century-layout.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 2
          sparse-checkout: |
            _work
            years
            meta
            sources/摘录
            sources/春秋左传
          sparse-checkout-cone-mode: true
      - name: Fetch the exact input snapshot
        run: |
          git fetch --filter=blob:none --depth=1 origin ab0b698f5908bafa621ac6a54078c1115eed3580
          git config user.name 'zhixin0825'
          git config user.email '32944152+zhixin0825@users.noreply.github.com'
      - name: Check content and links, then publish review result (not main)
        run: python3 _work/reorganize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: century-layout-validation
          path: _work/output/*.json
          if-no-files-found: warn
          retention-days: 7

name: Clean chronology source layout
on:
  push:
    branches: [work/clean-chronology-texts]
    paths:
      - .github/workflows/clean-chronology-sources.yml
      - scripts/clean_chronology_sources.py
      - tests/test_clean_chronology_sources.py
permissions:
  contents: write
concurrency:
  group: clean-chronology-texts
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/clean-chronology-texts
          fetch-depth: 0
      - name: Verify the fixed source snapshot
        run: git diff --exit-code 13eac0731e3a1233d04da261c1534f42bfdb87d0 -- texts/ classics/ zizhi-tongjian/ SHA256SUMS.txt
      - name: Test markup and rare-character handling
        run: python -m unittest discover -s tests -p 'test_clean_chronology_sources.py' -v
      - name: Build all cleaned texts and verify source maps
        run: python scripts/clean_chronology_sources.py
      - name: Check originals and existing chronology are unchanged
        run: git diff --exit-code -- texts/ classics/ zizhi-tongjian/ SHA256SUMS.txt chronicle/ provenance/
      - name: Save derived files only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working-texts/chronology-clean/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate source-mapped cleaned Chunqiu, Zuozhuan and complete Tongjian'
            git push origin HEAD:work/clean-chronology-texts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cleaned-chronology-texts
          path: |
            working-texts/chronology-clean/
            scripts/clean_chronology_sources.py
            tests/test_clean_chronology_sources.py
            provenance/CCDH_README.txt
            provenance/KANRIPO_SOURCE.txt
          retention-days: 14
          if-no-files-found: error

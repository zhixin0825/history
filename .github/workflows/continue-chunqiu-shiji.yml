name: Continue Chunqiu and Shiji
on:
  push:
    branches: [work/chunqiu-shiji-round2]
    paths:
      - .github/workflows/continue-chunqiu-shiji.yml
      - scripts/build_shiji_incremental.py
      - scripts/shiji_sequence.py
      - tests/test_shiji_incremental.py
      - chronicle/shiji-trial/batches/round2.psv
permissions:
  contents: write
concurrency:
  group: chunqiu-shiji-round2
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chunqiu-shiji-round2
      - name: Require the completed punctuated source backbone
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('working-texts/zuozhuan-punctuated-years/audit.json').read_text())
          assert a['complete_255_year_backbone'] and a['imported_years']==255
          PY
      - name: Enable explicit within-year precedence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_shiji_incremental.py');s=p.read_text()
          if 'from shiji_sequence import' not in s:
              s=s.replace('from shiji_first_appearance import plan_placements','from shiji_first_appearance import plan_placements\nfrom shiji_sequence import order_units, check_pages')
          s=s.replace('        rows.sort(key=month)','        rows=order_units(rows,month)')
          if '    check_pages(root)' not in s:
              s=s.replace('    print(json.dumps(stats,ensure_ascii=False,indent=2));return stats','    check_pages(root)\n    print(json.dumps(stats,ensure_ascii=False,indent=2));return stats')
          compile(s,str(p),'exec');p.write_text(s)
          PY
      - name: Rebuild cumulative reviewed chronology
        run: python scripts/build_shiji_incremental.py
      - name: Verify quotations, dates, aliases and all original year texts
        run: python -m unittest discover -s tests -p 'test_shiji_incremental.py' -v
      - name: Verify deterministic rebuild
        run: |
          python - <<'PY'
          import hashlib,subprocess
          from pathlib import Path
          def hashes():
              return {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('chronicle/shiji-trial').rglob('*') if p.is_file()}
          before=hashes()
          subprocess.run(['python','scripts/build_shiji_incremental.py'],check=True)
          assert hashes()==before,'Cumulative rebuild changed its own output'
          PY
      - name: Preserve original evidence and prior editorial decisions
        run: git diff --exit-code -- texts/ classics/ zizhi-tongjian/ working-texts/chronology-punctuated/ working-texts/zuozhuan-punctuated-years/ SHA256SUMS.txt chronicle/EDITORIAL_RULES.md chronicle/shiji-trial/reviewed.psv chronicle/shiji-trial/first-appearance.json
      - name: Save only reviewed and derived outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chronicle/shiji-trial/ chronicle/PROGRESS.md scripts/build_shiji_incremental.py
          if ! git diff --cached --quiet; then
            git commit -m 'Publish reviewed Shiji batch with validated event order and preserved source evidence'
            git push origin HEAD:work/chunqiu-shiji-round2
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chunqiu-shiji-round2-results
          path: |
            working-texts/zuozhuan-punctuated-years/
            working-texts/chronology-punctuated/main/tj-001.md
            working-texts/chronology-punctuated/main/tj-002.md
            chronicle/
            scripts/
            tests/
            README.md
          retention-days: 14
          if-no-files-found: error

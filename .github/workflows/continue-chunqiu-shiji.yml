name: Continue Chunqiu and Shiji
on:
  push:
    branches: [work/chunqiu-shiji-round2]
    paths:
      - .github/workflows/continue-chunqiu-shiji.yml
      - scripts/import_zuozhuan_years.py
permissions:
  contents: write
concurrency:
  group: chunqiu-shiji-round2
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chunqiu-shiji-round2
      - name: Recognize one verified source heading variant
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/import_zuozhuan_years.py')
          s=p.read_text()
          s=s.replace("r'[〖【](经|經|传|傳)[〗】]'", "r'[〖【](经传|经|經|传|傳)[〗】]'")
          s=s.replace("'kind':'jing' if m[1] in '经經' else 'zhuan'", "'kind':'jing' if m[1] in ('经','經') else 'zhuan','source_heading':m[1]")
          needle="            if not layers or any(not x['text'] for x in layers):"
          if "Unexpected combined heading" not in s:
              s=s.replace(needle,"            if any(x.get('source_heading')=='经传' for x in layers) and (g,y)!=(7,14):raise ValueError('Unexpected combined heading: needs explicit review')\n"+needle)
          compile(s,str(p),'exec');p.write_text(s)
          PY
      - name: Import existing punctuation and explicit year layers
        id: ingest
        continue-on-error: true
        run: python scripts/import_zuozhuan_years.py
      - name: Preserve raw sources and prior chronology
        run: git diff --exit-code -- texts/ classics/ zizhi-tongjian/ chronicle/ SHA256SUMS.txt
      - name: Save verified or explicitly partial results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working-texts/zuozhuan-punctuated-years/ scripts/import_zuozhuan_years.py
          if ! git diff --cached --quiet; then
            git commit -m 'Save original-text year import with explicit coverage and heading provenance'
            git push origin HEAD:work/chunqiu-shiji-round2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunqiu-shiji-round2-working-files
          path: |
            working-texts/zuozhuan-punctuated-years/
            chronicle/
            scripts/
            tests/
            texts/01_shiji_full.txt
            classics/ccdh/13_cq_mod.txt
            classics/ccdh/13_zz_mod.txt
          retention-days: 14
          if-no-files-found: warn
      - name: Fail visibly on incomplete source import
        if: steps.ingest.outcome != 'success'
        run: exit 1

name: Build full chronology checkpoint
on:
  push:
    branches: [work/full-chronicle-20260929]
    paths:
      - .github/workflows/full-chronicle-build.yml
      - scripts/build_chunqiu_reader.py
permissions:
  contents: write
concurrency:
  group: full-chronicle-build-20260929
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/full-chronicle-20260929
      - name: Render all authored Chunqiu paragraphs with exact original quotations
        run: python scripts/build_chunqiu_reader.py
      - name: Preserve raw sources, prior Shiji data and review input
        run: git diff --exit-code -- texts/ classics/ zizhi-tongjian/ working-texts/ chronicle/shiji-trial/
      - name: Commit generated reader only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chronicle/chunqiu/
          if ! git diff --cached --quiet; then
            git commit -m 'Render 244 annual Chunqiu pages from 1850 explicitly reviewed paragraphs'
            git push origin HEAD:work/full-chronicle-20260929
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-chronicle-draft-checkpoint
          path: |
            chronicle/
            scripts/
            tests/
            texts/01_shiji_full.txt
            classics/ccdh/13_cq_mod.txt
            classics/ccdh/13_zz_mod.txt
            zizhi-tongjian/kanripo/
            working-texts/zuozhuan-punctuated-years/
            working-texts/chronology-punctuated/main/
            working-texts/chronology-punctuated/manifest.json
          retention-days: 14
          if-no-files-found: error

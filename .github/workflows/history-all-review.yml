name: History complete-page review
on:
  push:
    branches: ['work/history-complete-review']
    paths: ['.history_all.py', '.github/workflows/history-all-review.yml']
permissions:
  contents: write
concurrency:
  group: history-complete-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply and validate complete-page revision on review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config user.name 'history-source-review'
          git config user.email '32944152+zhixin0825@users.noreply.github.com'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          printf '%s\n' '/README.md' '/.history_all.py' '/.history_all_part_*' '/.github/workflows/history-all-review.yml' '/years/**' '/meta/**' '/sources/**/*.md' '/sources/**/*.json' '/sources/二十四史/txt/03_houhanshu_full.txt' > .git/info/sparse-checkout
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout -b "$GITHUB_REF_NAME" FETCH_HEAD
          export HISTORY_ROOT="$PWD"
          export HISTORY_BASE=/tmp/history-main-baseline
          mkdir -p "$HISTORY_BASE"
          cp -a README.md years meta sources "$HISTORY_BASE/"
          python3 .history_all.py
          git add README.md years meta sources
          git diff --cached --stat | tail -12
          if ! git diff --cached --quiet; then
            git commit -m 'Complete revision of all 771 existing chronology reading pages'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "RESULT_COMMIT=$(git rev-parse HEAD)"
          echo "RESULT_TREE=$(git rev-parse HEAD^{tree})"
          mkdir -p /tmp/history-all-output
          python3 - <<'PY'
          import zipfile,hashlib,json
          from pathlib import Path
          files=[Path('README.md')]
          for directory in ('years','meta','sources'):
              files.extend(p for p in Path(directory).rglob('*') if p.is_file() and p.suffix in ('.md','.json'))
          manifest={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(files)}
          Path('/tmp/history-all-output/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          with zipfile.ZipFile('/tmp/history-all-output/history-all-final.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in files: z.write(p,str(p))
          for name in ('full_validation.json','quote_verification.json','source_navigation_log.json'):
              p=Path('/tmp/history-all-package')/name
              if p.exists(): (Path('/tmp/history-all-output')/name).write_bytes(p.read_bytes())
          print('READBACK_FILES',len(files))
          PY
      - name: Export complete revised text for independent readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-all-final-readback
          path: /tmp/history-all-output
          retention-days: 3

name: History century source review
on:
  push:
    branches: ['work/history-bce0700-0601-review']
    paths: ['.history_batch.py', '.github/workflows/history-century-review.yml']
permissions:
  contents: write
concurrency:
  group: history-century-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply and validate independently reviewed century edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git config user.name 'history-source-review'
          git config user.email '32944152+zhixin0825@users.noreply.github.com'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git sparse-checkout init --no-cone
          printf '%s\n' '/.history_batch.py' '/.history_part_*' '/.github/workflows/history-century-review.yml' '/years/**' '/meta/**' '/sources/**/*.md' '/sources/春秋左传/data/*.json' > .git/info/sparse-checkout
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout -b "$GITHUB_REF_NAME" FETCH_HEAD
          python3 .history_batch.py
          git add years meta sources
          git diff --cached --stat | tail -10
          if ! git diff --cached --quiet; then
            git commit -m 'Revise and verify 700–601 BCE chronicle against local primary texts'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "RESULT_COMMIT=$(git rev-parse HEAD)"
          echo "RESULT_TREE=$(git rev-parse HEAD^{tree})"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/history-review-final.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for root in ('years','meta','sources'):
                  for p in Path(root).rglob('*'):
                      if p.is_file() and p.suffix in ('.md','.json'):
                          z.write(p,str(p))
          print('TEXT_ARCHIVE_BYTES',Path('/tmp/history-review-final.zip').stat().st_size)
          PY
      - name: Export revised text for independent readback
        uses: actions/upload-artifact@v4
        with:
          name: history-century-review-final
          path: /tmp/history-review-final.zip
          retention-days: 3

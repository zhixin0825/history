name: Import punctuated chronology candidates
on:
  push:
    branches: [work/punctuated-chronology]
    paths:
      - .github/workflows/import-punctuated-chronology.yml
      - scripts/import_punctuated_chronology.py
permissions:
  contents: write
concurrency:
  group: punctuated-chronology-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/punctuated-chronology
      - name: Download public punctuated texts and preserve revision provenance
        run: python scripts/import_punctuated_chronology.py --cached
      - name: Check originals and prior chronology have not changed
        run: git diff --exit-code -- texts/ classics/ zizhi-tongjian/ chronicle/ SHA256SUMS.txt
      - name: Mark unpunctuated outputs as intermediate only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('working-texts/chronology-clean/README.md')
          text=p.read_text(encoding='utf-8')
          notice='> **状态修正：本目录无标点的《通鉴》仅为中间清理产物，不满足用户的编年输入要求。请查看[有标点候选底本](../chronology-punctuated/README.md)。原文件保留作对照，不作为可读成品。**\n\n'
          if notice not in text:
              p.write_text(notice+text,encoding='utf-8')
          PY
      - name: Save candidates and checks on working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add working-texts/chronology-punctuated/ working-texts/chronology-clean/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Store punctuated candidates with checks and mark unpunctuated files intermediate'
            git push origin HEAD:work/punctuated-chronology
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punctuated-chronology-candidates
          path: |
            working-texts/chronology-punctuated/
            scripts/import_punctuated_chronology.py
          retention-days: 14
          if-no-files-found: warn

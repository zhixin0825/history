name: Validate Qin volume 005 integration
on:
  push:
    branches: [work/qin005-20261004]
    paths: ['.github/workflows/qin005-publish.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _qin005
            years
            meta
            sources/摘录
            sources/春秋左传
            sources/二十四史/txt
          sparse-checkout-cone-mode: true
      - name: Fetch immutable baseline
        run: |
          git fetch --filter=blob:none --depth=1 origin dfcbe7a0a5c124a51490c145068d09f263922ed2
          git config user.name 'zhixin0825'
          git config user.email '32944152+zhixin0825@users.noreply.github.com'
      - name: Check exact reviewed input files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'early.py':'1bd704815db33ecc3d70dd64bf5711cc84f73006756e4606712ce6d42ab759d1',
            'middle.py':'36cb7f2ce82712b29d6fa317d95fdf536e3e963411723dd979dfb66d13345d8c',
            'late.py':'90fedf1eb6c838c47f5a4a1ae946a42ea436bbe38964e6acdce0a06ffea3aedf',
            'build.py':'0e026ac7a82f24992b774048bb9c7ee7a02f87566782734a974427e8cc6507e0'
          }
          for name,want in expected.items():
              got=hashlib.sha256(Path('_qin005',name).read_bytes()).hexdigest()
              assert got==want,(name,got,want)
          print('All four input files match the locally reviewed files.')
          PY
      - name: Validate and publish only the result branch
        run: |
          python3 _qin005/build.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('_qin005/report.json').read_text())
          assert not report['errors'],report['errors']
          assert report['result_tree']=='1ba005fc61c6e0ed6614bd7d4445965cbe484809',report['result_tree']
          assert report['year_pages']==444
          assert report['new_year_pages']==121
          print('Remote tree matches the complete locally validated tree; main was not changed.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qin005-validation
          path: |
            _qin005/report.json
            _qin005/matches.json
            _qin005/registry.json
          retention-days: 7
          if-no-files-found: warn

name: Render Dinggong 1-15 once
on:
  push:
    branches:
      - work/chunqiu-dinggong-01-15-20261001
    paths:
      - .github/workflows/render-dinggong-once.yml
      - scripts/build_dinggong_01_15.py
      - chronicle/chunqiu/dinggong/data/*.psv
      - chronicle/chunqiu/dinggong/data/supplemental-sources.json
permissions:
  contents: write
concurrency:
  group: render-dinggong-01-15-once
  cancel-in-progress: true
jobs:
  render:
    if: github.ref == 'refs/heads/work/chunqiu-dinggong-01-15-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out relevant text only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /chronicle/chunqiu/
            /working-texts/zuozhuan-punctuated-years/
            /scripts/
      - name: Apply checked ancient commentary to the handwritten draft
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('chronicle/chunqiu/dinggong/data/events-01-05.psv')
          rows = p.read_text(encoding='utf-8').splitlines()
          found = 0
          for i, line in enumerate(rows):
              f = line.split('|')
              if len(f) == 7 and f[0] == '4' and f[4] == '楚子涉雎济江':
                  f[5] = '“王割子期之心”不应直译为挖心杀人。已核《五礼通考》卷229所引杜预注，解释为胸前取血盟誓、表示诚意，不必把“心”判成工作本错字；原文保持不改。子期在下一年继续活动，也与此相合。'
                  f[6] = 'DU04'
                  rows[i] = '|'.join(f)
                  found += 1
          assert found == 1, found
          p.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
      - name: Render then check deterministic outputs
        run: |
          python3 -m py_compile scripts/build_dinggong_01_15.py
          python3 scripts/build_dinggong_01_15.py
          python3 scripts/build_dinggong_01_15.py --check
      - name: Commit verified pages to this work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chronicle/chunqiu scripts/build_dinggong_01_15.py
          if git diff --cached --quiet; then
            echo 'Rendered pages already match.'
          else
            git commit -m 'Render and validate complete Dinggong chronicle'
            git push origin HEAD:work/chunqiu-dinggong-01-15-20261001
          fi

name: Render Zhaogong 21-32 once
on:
  push:
    branches:
      - work/chunqiu-zhaogong-21-32-20260930
    paths:
      - .github/workflows/render-zhaogong-21-32-once.yml
      - scripts/build_zhaogong_21_32.py
      - chronicle/chunqiu/zhaogong/data/events-21-26.psv
      - chronicle/chunqiu/zhaogong/data/events-27-32.psv
      - chronicle/chunqiu/zhaogong/data/shiji-excerpts-21-32.json
permissions:
  contents: write
concurrency:
  group: render-zhaogong-21-32-once
  cancel-in-progress: true
jobs:
  render:
    if: github.ref == 'refs/heads/work/chunqiu-zhaogong-21-32-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out relevant source and chronicle text only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /chronicle/chunqiu/
            /working-texts/zuozhuan-punctuated-years/
            /scripts/
      - name: Correct the manually summed aggregate; retain individual source checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_zhaogong_21_32.py')
          s = p.read_text(encoding='utf-8')
          # Individual verified counts are 90 jing + 115 zhuan = 205, not 215.
          s = s.replace('215 unique source paragraphs', '205 unique source paragraphs')
          s = s.replace("== 215, 'Unexpected source total'", "== 205, 'Unexpected source total'")
          s = s.replace('215段经传全部有去向', '205段经传全部有去向')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Render and verify all source destinations
        run: |
          python3 -m py_compile scripts/build_zhaogong_21_32.py
          python3 scripts/build_zhaogong_21_32.py
          python3 scripts/build_zhaogong_21_32.py --check
      - name: Commit validated pages to the work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chronicle/chunqiu scripts/build_zhaogong_01_10.py scripts/build_zhaogong_21_32.py
          if git diff --cached --quiet; then
            echo 'Generated files already match.'
          else
            git commit -m 'Render and validate Zhaogong years 21-32'
            git push origin HEAD:work/chunqiu-zhaogong-21-32-20260930
          fi

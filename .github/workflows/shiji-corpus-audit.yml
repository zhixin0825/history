name: Shiji chronology trial
on:
  push:
    branches: [work/shiji-chronicle-trial]
    paths:
      - .github/workflows/shiji-corpus-audit.yml
      - scripts/build_shiji_trial.py
      - chronicle/shiji-trial/reviewed.psv
      - chronicle/shiji-trial/REPORT.md
permissions:
  contents: write
concurrency:
  group: shiji-chronology-trial
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/shiji-chronicle-trial
      - name: Apply idempotent index-renderer repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_shiji_trial.py')
          original = p.read_text(encoding='utf-8')
          lines = original.splitlines()
          for i, s in enumerate(lines):
              if s.startswith("    md += [f'| [公元前"):
                  expression = s[len('    md += '):]
                  lines[i] = "    md[-1] += '\\n' + '\\n'.join(" + expression + ")"
          repaired = '\n'.join(lines) + '\n'
          compile(repaired, str(p), 'exec')
          if repaired != original:
              p.write_text(repaired, encoding='utf-8')
          PY
      - name: Render and validate
        run: python scripts/build_shiji_trial.py
      - name: Check original corpus is unchanged
        run: git diff --exit-code -- texts/ classics/ zizhi-tongjian/ SHA256SUMS.txt
      - name: Save derived files and renderer repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chronicle/shiji-trial/ scripts/build_shiji_trial.py
          if ! git diff --cached --quiet; then
            git commit -m 'Generate and validate Shiji trial with readable year index'
            git push origin HEAD:work/shiji-chronicle-trial
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shiji-chronology-trial-results
          path: |
            chronicle/
            scripts/build_shiji_trial.py
            README.md
            provenance/CCDH_README.txt
            provenance/KANRIPO_SOURCE.txt
          retention-days: 14
          if-no-files-found: error

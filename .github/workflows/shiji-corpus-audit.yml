name: Shiji chronology trial
on:
  push:
    branches: [work/shiji-chronicle-trial]
    paths:
      - .github/workflows/shiji-corpus-audit.yml
      - scripts/build_shiji_trial.py
      - chronicle/shiji-trial/reviewed.psv
      - chronicle/shiji-trial/REPORT.md
permissions:
  contents: write
concurrency:
  group: shiji-chronology-trial
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/shiji-chronicle-trial
      - name: Render and validate
        run: python scripts/build_shiji_trial.py
      - name: Check original corpus is unchanged
        run: git diff --exit-code -- texts/ classics/ zizhi-tongjian/ SHA256SUMS.txt
      - name: Save derived files only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chronicle/shiji-trial/
          if ! git diff --cached --quiet; then
            git commit -m 'Generate 26 Shiji trial year pages, source ledger and validated references'
            git push origin HEAD:work/shiji-chronicle-trial
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shiji-chronology-trial-results
          path: |
            chronicle/
            scripts/build_shiji_trial.py
            README.md
            provenance/CCDH_README.txt
            provenance/KANRIPO_SOURCE.txt
          retention-days: 14
          if-no-files-found: error

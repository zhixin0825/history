name: Shiji 66 integration checks
on:
  push:
    branches: [work/shiji-merge-066-20261003]
    paths:
      - .github/workflows/shiji-merge-066-once.yml
      - scripts/integrate_shiji_066.py
      - chronicle/shiji-integration/data/merge-066.json
permissions:
  contents: write
concurrency:
  group: shiji-merge-066-once
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /chronicle/
            /working-texts/zuozhuan-punctuated-years/
            /scripts/
            /texts/01_shiji_full.txt
      - name: Fetch the immutable pre-integration text baseline
        run: git fetch --no-tags --filter=blob:none --depth=1 origin be6f5437767f09cd474107cefee81050d9d0605b
      - name: Make local-link checks work in a sparse checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/integrate_shiji_066.py')
          s=p.read_text(encoding='utf-8')
          old="    baseline: dict[str, bytes | None] = {}\n"
          new=old+"    repository_paths = set(subprocess.check_output(['git','ls-tree','-r','--name-only',base], cwd=ROOT, text=True).splitlines())\n"
          if '    repository_paths = ' not in s:
              assert old in s
              s=s.replace(old,new,1)
          old="            require(rel in rendered or target.is_file(), f'Broken local link {path}:{link}')"
          new="            require(rel in rendered or target.is_file() or rel in repository_paths, f'Broken local link {path}:{link}')"
          assert old in s or new in s
          s=s.replace(old,new)
          old="            if target_data is None and target.suffix=='.md':\n                target_data=target.read_text(encoding='utf-8')"
          new="            if target_data is None and target.is_file() and target.suffix=='.md':\n                target_data=target.read_text(encoding='utf-8')"
          assert old in s or new in s
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Integrate and verify identical second run
        run: |
          python3 -m py_compile scripts/integrate_shiji_066.py
          python3 scripts/integrate_shiji_066.py
          python3 scripts/integrate_shiji_066.py --check
      - name: Verify old renderers cannot erase the new material
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          for name in ('build_zhaogong_21_32.py','build_dinggong_01_15.py','build_aigong_01_27.py'):
              p=subprocess.run(['python3','scripts/'+name,'--check'],capture_output=True,text=True)
              assert p.returncode!=0 and '已有史记汇入层' in p.stderr, (name,p.stderr)
          print('All three historical generators stop before overwriting integrated pages.')
          PY
      - name: Commit only this integration work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chronicle scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate full Wuzixu biography into existing chronology and validate preservation'
            git push origin HEAD:work/shiji-merge-066-20261003
          fi

name: One-time volume 017 review
on:
  push:
    branches: [work/shiji017-20261029]
    paths: [.github/workflows/shiji017-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            years
            meta
            sources/摘录
          fetch-depth: 1
      - name: Export text-only review snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, subprocess, urllib.request, urllib.parse
          with zipfile.ZipFile('/tmp/shiji017-snapshot.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root in ['years','meta','sources/摘录']:
                  for p in Path(root).rglob('*.md'):
                      z.write(p,p.as_posix())
              for p in ['README.md','sources/README.md']:
                  if Path(p).exists(): z.write(p,p)
              z.writestr('BASE_SHA.txt', subprocess.check_output(['git','rev-parse','HEAD']).decode())
              u='https://zh.wikisource.org/w/index.php?'+urllib.parse.urlencode({'title':'史記/卷017','oldid':'2607010'})
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'history-volume-review/1.0'}),timeout=45)
                  z.writestr('volume017.html',r.read())
              except Exception as e:
                  print('Public source fetch:',type(e).__name__,str(e))
          print('Text snapshot bytes:',Path('/tmp/shiji017-snapshot.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiji017-review-snapshot
          path: /tmp/shiji017-snapshot.zip
          retention-days: 3

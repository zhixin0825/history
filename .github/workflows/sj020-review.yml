name: SJ020 one-time editorial review
on:
  push:
    branches: [work/sj020-20261102]
    paths: [.github/workflows/sj020-review.yml, .github/sj020-payload.json]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Export additional public source witnesses
        shell: python
        run: |
          import urllib.request,urllib.parse,zipfile,json,time
          pages=['資治通鑑/卷'+str(n).zfill(3) for n in range(17,29)]+['漢書/卷'+x for x in ['039','059','060','073','074','089','097上','098']]+['讀史記十表 (四庫全書本)/卷08','資治通鑑考異/卷01']
          out={};errors={}
          for title in pages:
              try:
                  req=urllib.request.Request('https://zh.wikisource.org/wiki/'+urllib.parse.quote(title),headers={'User-Agent':'HistoryChronicleResearch/1.0 (source verification)'})
                  with urllib.request.urlopen(req,timeout=45) as r:out[title.replace('/','-')+'.html']=r.read()
              except Exception as e:errors[title]=str(e)
              time.sleep(0.25)
          with zipfile.ZipFile('sj020-more-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p,b in out.items():z.writestr('public/'+p,b)
              z.writestr('public-errors.json',json.dumps(errors,ensure_ascii=False))
          print(json.dumps({'downloaded':len(out),'errors':errors},ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        with:
          name: sj020-more-sources
          path: sj020-more-sources.zip
          retention-days: 7
